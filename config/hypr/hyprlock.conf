# hyprlock — lock screen
# palette: ~/.config/hypr/scheme/demonshot.lua

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0D0B0EFF)
}

# time
label {
    monitor =
    text = $TIME
    color = rgba(E9DFDDFF)
    font_size = 108
    font_family = JetBrains Mono Light
    position = 0, 150
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = $DATE
    color = rgba(7A6870FF)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, 60
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    color = rgba(B8487AFF)
    font_size = 15
    font_family = JetBrains Mono
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    position = 0, -120
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 6
    outer_color = rgba(2B1820FF)
    inner_color = rgba(151116FF)
    font_color = rgba(E9DFDDFF)
    font_family = JetBrains Mono

    fade_on_empty = false
    placeholder_text = <span foreground="##7A6870">password</span>
    fail_text = <span foreground="##C7303DFF">wrong · $ATTEMPTS</span>
    dots_size = 0.25
    dots_spacing = 0.55
    check_color = rgba(C7303DFF)
    capslock_color = rgba(B8487AFF)
}
